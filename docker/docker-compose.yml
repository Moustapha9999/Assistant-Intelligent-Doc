

services:

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: assistant_intelligent_doc
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      # Prioritaire sur le QDRANT_URL=localhost du .env (localhost = le conteneur lui-même)
      QDRANT_URL: http://qdrant:6333
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - ../data:/app/data
      - ../models_cache:/app/models_cache

  # ── Base vectorielle Qdrant ──────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_assistant
    restart: unless-stopped
    ports:
      - "6333:6333"   # API REST
      - "6334:6334"   # gRPC
    volumes:
      - ../qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      # L'image qdrant/qdrant ne contient ni curl ni wget
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: assistant_network