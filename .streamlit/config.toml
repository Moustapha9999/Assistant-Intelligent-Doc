[browser]
gatherUsageStats = false

[server]
headless = true
# Valeurs par défaut, rendues explicites : protection XSRF et CORS restrictif
enableXsrfProtection = true
enableCORS = true

[theme]
base = "dark"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1a1a1a"
textColor = "#f5f4ef"
primaryColor = "#5b9fd4"
