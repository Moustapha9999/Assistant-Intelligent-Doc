[browser]
gatherUsageStats = false

[server]
headless = true
# Valeurs par défaut, rendues explicites : protection XSRF et CORS restrictif
enableXsrfProtection = true
enableCORS = true

[theme]
base = "dark"
backgroundColor = "#0D1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
primaryColor = "#58A6FF"
